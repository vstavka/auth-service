x-app: &app  build: .  env_file:    - .env  environment:    DB_HOST: ${DB_HOST:-host.docker.internal}    CACHE_BACKEND: redis    REDIS_HOST: redisservices:  migrate:    <<: *app    command: alembic upgrade head    restart: "no"  outbox-relay:    <<: *app    command: python -m src.workers.outbox    restart: unless-stopped    depends_on:      migrate:        condition: service_completed_successfully    environment:      DB_HOST: ${DB_HOST:-host.docker.internal}      EVENTS_PUBLISHER: file      EVENTS_FILE_PATH: /app/events.jsonl  app:    <<: *app    restart: unless-stopped    ports:      - "${APP_PORT:-8000}:8000"    depends_on:      migrate:        condition: service_completed_successfully    develop:      watch:        - action: sync          path: .          target: /app          ignore:            - .git/            - .venv/            - __pycache__/            - .pytest_cache/            - .mypy_cache/            - .ruff_cache/        - action: rebuild          path: pyproject.toml        - action: rebuild          path: poetry.lock