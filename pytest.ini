[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto

markers =
    unit: Fast isolated tests without external services
    integration: Tests requiring database, Redis, queues, or other infrastructure
    e2e: End-to-end tests covering complete user scenarios

addopts =
    -v
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=55